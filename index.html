<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Биохимия — тест: белки и ферменты</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5FA; --surface:#FFFFFF; --ink:#1B2140; --muted:#5F6688; --line:#DCE0EE;
  --violet:#6A4BC4; --violet-soft:#ECE7FB; --ok:#23825E; --ok-soft:#E3F3EC; --bad:#C2453C; --bad-soft:#FBE9E7;
  --amber:#B97C0E;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11152A; --surface:#191E37; --ink:#E7E9F6; --muted:#9DA3C4; --line:#2C3256;
    --violet:#A28BF2; --violet-soft:#2A2550; --ok:#4CC294; --ok-soft:#163327; --bad:#EE7468; --bad-soft:#3A1E1E; --amber:#E6B04A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11152A; --surface:#191E37; --ink:#E7E9F6; --muted:#9DA3C4; --line:#2C3256;
  --violet:#A28BF2; --violet-soft:#2A2550; --ok:#4CC294; --ok-soft:#163327; --bad:#EE7468; --bad-soft:#3A1E1E; --amber:#E6B04A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(28px,6vw,40px);letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:17px;font-weight:500}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand svg{flex:none}
.who{font-size:14px;color:var(--muted);text-align:right}
.who b{color:var(--ink);font-weight:600}

/* hero chain */
.hero{margin:8px 0 28px}
.hero h1{margin:14px 0 10px}
.hero-chain{display:block;width:100%;max-width:520px;height:auto}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel + .panel{margin-top:16px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.field input:focus{border-color:var(--violet);outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > .field{flex:1 1 200px}
.err{color:var(--bad);font-size:14px;min-height:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.violet{background:var(--violet);border-color:var(--violet);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.link{border:none;background:none;padding:6px 0;color:var(--violet);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* setup */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:9px 16px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.setgroup{margin-bottom:20px}
.setgroup > .lbl{font-size:14px;color:var(--muted);margin-bottom:8px}
.topics{display:grid;gap:8px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--violet);width:17px;height:17px;flex:none}
.chk .cnt{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.chk:has(input:checked){border-color:var(--violet);background:var(--violet-soft)}
.weakline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* chain progress */
.chain{display:flex;flex-wrap:wrap;gap:6px 0;margin:4px 0 22px;padding:0;list-style:none}
.chain li{display:flex;align-items:center}
.chain li + li::before{content:"";width:8px;height:2px;background:var(--line)}
.res{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);padding:0;display:grid;place-items:center}
.res.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.res.cur{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft);color:var(--violet)}
.res.done.cur{background:var(--violet);border-color:var(--violet);color:#fff}
.res.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.res.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.res.part{background:var(--amber);border-color:var(--amber);color:#fff}
.chain.dense{gap:5px}
.chain.dense li + li::before{display:none}
.chain.dense .res{width:14px;height:14px;font-size:0;border-width:1.5px}
.opt.is-ok[aria-checked="true"] .mk{border-color:var(--ok);background:var(--ok)}
.opt.is-bad[aria-checked="true"] .mk{border-color:var(--bad);background:var(--bad)}

.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:10px}
.qtext{font-size:19px;font-weight:500;white-space:pre-line;margin-bottom:6px}
.qhint{font-size:14px;color:var(--muted);margin-bottom:16px}
.qimg{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);line-height:1.4}
.opt:hover{border-color:var(--muted)}
.opt .mk{flex:none;width:20px;height:20px;margin-top:1px;border:2px solid var(--muted);display:grid;place-items:center}
.opt.radio .mk{border-radius:50%}
.opt.box .mk{border-radius:5px}
.opt[aria-checked="true"]{border-color:var(--violet);background:var(--violet-soft)}
.opt[aria-checked="true"] .mk{border-color:var(--violet);background:var(--violet)}
.opt[aria-checked="true"] .mk::after{content:"";width:8px;height:8px;border-radius:inherit;background:#fff}
.opt.box[aria-checked="true"] .mk::after{border-radius:1px}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-miss{border-color:var(--ok);border-style:dashed}
.opt[disabled]{cursor:default}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.mrow select.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.mrow select.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.mrow .fix{grid-column:2;font-size:14px;color:var(--ok);margin-top:-4px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}.mrow .fix{grid-column:1}}
.numin{width:180px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:18px}
.numin.is-ok{border-color:var(--ok)} .numin.is-bad{border-color:var(--bad)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.part{background:var(--violet-soft);color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.nav .right{display:flex;gap:10px;flex-wrap:wrap}

/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.score .big{font-family:var(--display);font-size:clamp(48px,12vw,76px);font-weight:700;line-height:1}
.review{margin-top:20px;display:grid;gap:12px}
.ritem{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}
.ritem.ok{border-left-color:var(--ok)} .ritem.bad{border-left-color:var(--bad)} .ritem.part{border-left-color:var(--amber)}
.ritem .q{font-weight:500;white-space:pre-line;margin-bottom:6px}
.ritem .l{font-size:14px;color:var(--muted)}
.ritem .v{font-size:15px}
.ritem .v.good{color:var(--ok)}
.ritem .v.wrong{color:var(--bad)}

/* stats */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.meter > i{display:block;height:100%;background:var(--ok)}
.meter.low > i{background:var(--bad)} .meter.mid > i{background:var(--amber)}
.tabs{display:flex;gap:6px;margin:16px 0}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin-top:40px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .hero-chain circle{animation:pop .5s backwards}
  @keyframes pop{from{transform:scale(0);opacity:0}}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===== Банк вопросов: Биохимия, контрольная 1 (аминокислоты, белки, ферменты) =====
// Типы: single — один ответ; multi — несколько ответов; match — соответствие; num — число.
// Для single: a — правильный ответ, w — неверные (на экран выводится правильный + 3–4 случайных неверных).
const TOPICS = {
  aa:   "Аминокислоты и пептиды",
  prot: "Структура и свойства белков",
  meth: "Методы исследования белков",
  enz:  "Ферменты: строение и классификация",
  kin:  "Кинетика, ингибирование, регуляция",
  clin: "Энзимодиагностика и энзимотерапия"
};

const AA_PROPS = {
  hyd: "Это гидрофобная аминокислота",
  pol: "Это полярная аминокислота",
  br:  "Это аминокислота с разветвленным алифатическим радикалом",
  ar:  "Это ароматическая аминокислота",
  s:   "Это серосодержащая аминокислота",
  oh:  "Это аминокислота, содержащая гидроксильную группу",
  pos: "Это полярная положительно заряженная аминокислота",
  neg: "Это полярная отрицательно заряженная аминокислота",
  imi: "Это иминокислота",
  dic: "Это моноаминодикарбоновая кислота"
};

const RAW = [
// ---------- Аминокислоты и пептиды ----------
{id:"aa01",t:"aa",type:"single",q:"К ароматическим аминокислотам относят:",a:"фенилаланин, тирозин, триптофан",w:["глицин, аланин, валин","лизин, аргинин, гистидин","серин, треонин, цистеин","лейцин, изолейцин, метионин"]},
{id:"aa02",t:"aa",type:"single",q:"В бензоле лучше всего растворим:",a:"лейцин",w:["серин","лизин","глутаминовая кислота","аспарагин"]},
{id:"aa03",t:"aa",type:"single",q:"К гидрофильным аминокислотам относится:",a:"серин",w:["валин","лейцин","фенилаланин","аланин"]},
{id:"aa04",t:"aa",type:"single",q:"К гидрофильным аминокислотам относится:",a:"треонин",w:["изолейцин","метионин","пролин","валин"]},
{id:"aa05",t:"aa",type:"single",q:"Гидрофобный радикал имеет аминокислота:",a:"валин",w:["серин","лизин","аспарагиновая кислота","глутамин"]},
{id:"aa06",t:"aa",type:"single",q:"Гидрофобный радикал имеют аминокислоты:",a:"фенилаланин, аланин",w:["серин, треонин","лизин, аргинин","аспартат, глутамат","аспарагин, глутамин"]},
{id:"aa07",t:"aa",type:"single",q:"Положительно заряженный радикал имеют аминокислоты:",a:"лизин, аргинин",w:["аспартат, глутамат","серин, треонин","валин, лейцин","тирозин, триптофан"]},
{id:"aa08",t:"aa",type:"single",q:"Положительно заряженной аминокислотой является:",a:"лизин",w:["глутаминовая кислота","серин","аланин","тирозин"]},
{id:"aa09",t:"aa",type:"single",q:"Отрицательно заряженной аминокислотой является:",a:"глутаминовая кислота",w:["лизин","аргинин","гистидин","глутамин"]},
{id:"aa10",t:"aa",type:"single",q:"К полярным незаряженным аминокислотам относятся:",a:"тирозин",w:["лизин","аспартат","лейцин","аланин"]},
{id:"aa11",t:"aa",type:"single",q:"Свойствами поверхностно-активного вещества обладает:",a:"лейцин",w:["глицин","серин","лизин","глутамат"]},
{id:"aa12",t:"aa",type:"single",q:"При гидроксилировании фенилаланина гидрофобность:",a:"уменьшается",w:["увеличивается","не изменяется","сначала увеличивается, затем уменьшается"]},
{id:"aa13",t:"aa",type:"single",q:"От каких факторов зависит существование аминокислот в состоянии равновесия (водная фаза)?",a:"от pH среды",w:["от атмосферного давления","от освещённости","от молекулярной массы аминокислоты","от концентрации глюкозы"]},
{id:"aa14",t:"aa",type:"single",q:"В состав протаминов в большом количестве входит:",a:"лизин",w:["цистеин","пролин","триптофан","аспартат"]},
{id:"aa15",t:"aa",type:"single",q:"В состав кератинов в большом количестве входит:",a:"цистеин",w:["лизин","триптофан","гистидин","аспартат"]},
{id:"aa16",t:"aa",type:"single",q:"Препятствует образованию альфа-спирали полипептидной цепи:",a:"пролин",w:["аланин","лейцин","метионин","глутамин"]},
{id:"aa17",t:"aa",type:"single",q:"Какую аминокислоту можно использовать для реактивации тиоловых групп в составе ферментов?",a:"цистеин",w:["метионин","серин","глицин","аланин"]},
{id:"aa18",t:"aa",type:"single",q:"Как называется значение pH, при котором заряд белка равен нулю?",a:"изоэлектрическая точка",w:["точка денатурации","оптимум pH","буферная точка","константа диссоциации"]},
{id:"aa19",t:"aa",type:"single",q:"Изоэлектрическая точка пептида гис-фен-арг:",a:"выше pH 7,0",w:["ниже pH 7,0","в области pH 7,0","равна нулю"]},
{id:"aa20",t:"aa",type:"single",q:"Изоэлектрическая точка пептида асп-лей-трп:",a:"ниже pH 7,0",w:["выше pH 7,0","в области pH 7,0","равна нулю"]},
{id:"aa21",t:"aa",type:"single",q:"При pH 10,0 пептид мет-лиз-глн:",a:"имеет отрицательный заряд",w:["имеет положительный заряд","электронейтрален","находится в изоэлектрическом состоянии"]},
{id:"aa22",t:"aa",type:"single",q:"При pH 3,0 пептид глу-иле-про будет:",a:"иметь положительный заряд",w:["иметь отрицательный заряд","электронейтрален","находиться в изоэлектрическом состоянии"]},
{id:"aa23",t:"aa",type:"single",q:"При каком pH легче всего разделить смесь глицина, аргинина и аспарагиновой кислоты методом электрофореза?",a:"7,0",w:["1,0","3,0","10,8","12,5"]},

{id:"aa30",t:"aa",type:"aaprop",aa:"изолейцин",ok:["br","hyd"]},
{id:"aa31",t:"aa",type:"aaprop",aa:"валин",ok:["br","hyd"]},
{id:"aa32",t:"aa",type:"aaprop",aa:"лейцин",ok:["br","hyd"]},
{id:"aa33",t:"aa",type:"aaprop",aa:"фенилаланин",ok:["hyd","ar"]},
{id:"aa34",t:"aa",type:"aaprop",aa:"цистеин",ok:["s","pol"]},
{id:"aa35",t:"aa",type:"aaprop",aa:"серин",ok:["oh","pol"]},
{id:"aa36",t:"aa",type:"aaprop",aa:"тирозин",ok:["oh","ar","pol"]},
{id:"aa37",t:"aa",type:"aaprop",aa:"метионин",ok:["s","hyd"]},
{id:"aa38",t:"aa",type:"aaprop",aa:"треонин",ok:["pol","oh"]},
{id:"aa39",t:"aa",type:"aaprop",aa:"триптофан",ok:["hyd","ar"]},
{id:"aa40",t:"aa",type:"aaprop",aa:"глутаминовую кислоту",ok:["dic","neg"]},
{id:"aa41",t:"aa",type:"aaprop",aa:"пролин",ok:["imi","hyd"]},

{id:"aa50",t:"aa",type:"multi",q:"Дайте название пептиду и определите его заряд при pH значительно больше 7,0:\nАрг-Тре-Цис",a:["аргинилтреонилцистеин","заряд −"],w:["аргинилтреонилцистин","цистеинилтреониларгинин","заряд +","заряд 0"]},
{id:"aa51",t:"aa",type:"multi",q:"Дайте название пептиду и определите его заряд при pH значительно меньше 7,0:\nВал-Сер-Про",a:["валилсерилпролин","заряд +"],w:["пролилсерилвалин","валинсеринпролин","заряд −","заряд 0"]},
{id:"aa52",t:"aa",type:"multi",q:"Дайте название пептиду и определите его заряд при pH = 7,0:\nАрг-Сер-Про",a:["аргинилсерилпролин","заряд +"],w:["аргинилсерилпролил","пролилсериларгинин","заряд −","заряд 0"]},

<script>
(function(){
"use strict";
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const KEY_USER = "bxkt1:user";
const histKey = u => "bxkt1:hist:" + (u.last + "|" + u.first + "|" + u.group).toLowerCase();
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const plural = (n, one, few, many) => { const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?one:(m10>=2&&m10<=4&&(m100<12||m100>14))?few:many; };
const fmt = x => (Math.round(x*10)/10).toString().replace(".", ",");
const BY_ID = Object.fromEntries(RAW.map(r => [r.id, r]));

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

// ---------- Построение вопроса из банка ----------
function qTitle(r){ return r.type === "aaprop" ? "Выберите из списка утверждения, верно характеризующие " + r.aa + "." : r.q; }
function build(r){
  const q = { id:r.id, t:r.t, type:r.type, text:qTitle(r), img:r.img || null };
  if (r.type === "single"){
    const wrong = r.fixed ? r.w : shuffle(r.w).slice(0, 3);
    const list = [{text:r.a, ok:true}, ...wrong.map(w => ({text:w, ok:false}))];
    q.options = r.fixed ? list : shuffle(list);
    q.hint = "Выберите один ответ";
  } else if (r.type === "multi" || r.type === "aaprop"){
    let list;
    if (r.type === "aaprop"){
      const okKeys = r.ok, others = shuffle(Object.keys(AA_PROPS).filter(k => !okKeys.includes(k))).slice(0, 6 - okKeys.length);
      list = [...okKeys.map(k => ({text:AA_PROPS[k], ok:true})), ...others.map(k => ({text:AA_PROPS[k], ok:false}))];
    } else {
      list = [...r.a.map(a => ({text:a, ok:true})), ...r.w.map(w => ({text:w, ok:false}))];
    }
    q.options = shuffle(list);
    q.type = "multi";
    q.hint = "Выберите один или несколько ответов";
  } else if (r.type === "match"){
    q.pairs = shuffle(r.pairs.map(p => ({left:p[0], right:p[1]})));
    q.choices = shuffle(r.pairs.map(p => p[1]));
    q.hint = "Сопоставьте каждый пункт с вариантом из списка";
  } else if (r.type === "num"){
    q.ans = r.ans;
    q.hint = "Введите число (дробную часть можно через запятую)";
  }
  return q;
}
function emptyAnswer(q){ return q.type==="single" ? null : q.type==="multi" ? [] : q.type==="match" ? q.pairs.map(()=> "") : ""; }
function isAnswered(q, a){
  if (q.type==="single") return a !== null;
  if (q.type==="multi") return a.length > 0;
  if (q.type==="match") return a.some(x => x);
  return String(a).trim() !== "";
}
function grade(q, a){
  if (q.type==="single") return (a !== null && q.options[a].ok) ? 1 : 0;
  if (q.type==="multi"){
    const need = q.options.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
    return (a.length===need.length && need.every(i=>a.includes(i))) ? 1 : 0;
  }
  if (q.type==="match"){ const n = q.pairs.filter((p,i)=>a[i]===p.right).length; return n / q.pairs.length; }
  const v = parseFloat(String(a).replace(",", ".").replace(/\s/g,""));
  return (!isNaN(v) && Math.abs(v - q.ans) < 1e-6) ? 1 : 0;
}
function correctText(q){
  if (q.type==="single" || q.type==="multi") return q.options.filter(o=>o.ok).map(o=>o.text).join("; ");
  if (q.type==="match") return q.pairs.map(p=>p.left+" — "+p.right).join("\n");
  return String(q.ans).replace(".", ",");
}
function userText(q, a){
  if (!isAnswered(q,a)) return "нет ответа";
  if (q.type==="single") return q.options[a].text;
  if (q.type==="multi") return a.map(i=>q.options[i].text).join("; ");
  if (q.type==="match") return q.pairs.map((p,i)=>p.left+" — "+(a[i]||"…")).join("\n");
  return String(a);
}

// ---------- Состояние ----------
let user = LS.get(KEY_USER, null);
let settings = { size: 20, topics: Object.keys(TOPICS), instant: true };
let session = null;

function loadHist(){ return LS.get(histKey(user), { attempts:[], q:{} }); }
function saveHist(h){ if(!LS.set(histKey(user), h)) toast("Не удалось сохранить историю в браузере"); }

// ---------- Экраны ----------
function topBar(){
  return `<div class="bar">
    <div class="brand">${chainIcon()}<span>Биохимия: белки и ферменты</span></div>
    ${user ? `<div class="who"><b>${esc(user.last)} ${esc(user.first)}</b><br>группа ${esc(user.group)}</div>` : ""}
  </div>`;
}
function chainIcon(){
  return `<svg width="34" height="18" viewBox="0 0 34 18" aria-hidden="true"><line x1="5" y1="9" x2="29" y2="9" stroke="currentColor" stroke-width="2" opacity=".35"/><circle cx="5" cy="9" r="4.5" fill="var(--violet)"/><circle cx="17" cy="9" r="4.5" fill="var(--ink)"/><circle cx="29" cy="9" r="4.5" fill="var(--ok)"/></svg>`;
}
function heroChain(){
  const cols = ["var(--violet)","var(--ink)","var(--ok)","var(--ink)","var(--violet)","var(--ink)","var(--bad)","var(--ink)","var(--violet)"];
  const labels = ["Гли","Лиз","Тир","Асп","Сер","Фен","Цис","Ала","Про"];
  let s = `<svg class="hero-chain" viewBox="0 0 520 60" role="img" aria-label="Пептидная цепь из девяти остатков">`;
  s += `<path d="M26 30 ${labels.map((_,i)=>`L${26+i*58} ${i%2?18:42}`).join(" ")}" fill="none" stroke="var(--line)" stroke-width="3"/>`;
  labels.forEach((l,i)=>{ const x=26+i*58, y=i%2?18:42;
    s += `<circle cx="${x}" cy="${y}" r="16" fill="${cols[i]}" style="animation-delay:${i*60}ms;transform-origin:${x}px ${y}px"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--paper)" font-family="Golos Text,sans-serif">${l}</text>`; });
  return s + `</svg>`;
}

function renderLogin(){
  $app.innerHTML = `${topBar()}
  <section class="hero">${heroChain()}
    <h1>Тест по белкам и ферментам</h1>
    <p class="muted">${RAW.length} ${plural(RAW.length,"вопрос","вопроса","вопросов")} по контрольной: аминокислоты, структура белков, методы исследования, ферменты и энзимодиагностика. Пароль не нужен — история сохраняется в этом браузере.</p>
  </section>
  <form class="panel" id="login" novalidate>
    <div class="row">
      <label class="field"><span>Фамилия</span><input name="last" autocomplete="family-name" required></label>
      <label class="field"><span>Имя</span><input name="first" autocomplete="given-name" required></label>
    </div>
    <label class="field"><span>Группа</span><input name="group" required placeholder="например, 1.2-С"></label>
    <div class="err" id="lerr"></div>
    <button class="btn" type="submit">Войти</button>
  </form>
  <p class="foot">Данные и результаты хранятся только на этом устройстве.</p>`;
  document.getElementById("login").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const u = { last:String(f.get("last")).trim(), first:String(f.get("first")).trim(), group:String(f.get("group")).trim() };
    if (!u.last || !u.first || !u.group){ document.getElementById("lerr").textContent = "Заполните фамилию, имя и группу."; return; }
    user = u; LS.set(KEY_USER, u); renderHome();
  });
}

function weakIds(){
  const h = loadHist();
  return Object.entries(h.q).filter(([id,s]) => s.wrong > 0 && BY_ID[id])
    .sort((a,b) => (b[1].wrong/b[1].seen - a[1].wrong/a[1].seen) || (b[1].wrong - a[1].wrong))
    .map(([id]) => id);
}

function renderHome(){
  const h = loadHist();
  const weak = weakIds();
  const last = h.attempts[h.attempts.length-1];
  const counts = {}; RAW.forEach(r => counts[r.t] = (counts[r.t]||0) + 1);
  $app.innerHTML = `${topBar()}
  <section class="hero" style="margin-bottom:22px">
    <h1>Новый тест</h1>
    <p class="muted">${last ? `Последняя попытка: ${fmt(last.score)} из ${last.n} (${Math.round(last.score/last.n*100)}%), ${new Date(last.date).toLocaleDateString("ru-RU")}.` : "Вы ещё не проходили тест."}</p>
  </section>
  <div class="panel">
    <div class="setgroup"><div class="lbl">Количество вопросов</div>
      <div class="seg" id="size">${[10,20,30,0].map(n=>`<button type="button" data-n="${n}" aria-pressed="${settings.size===n}">${n||"Все"}</button>`).join("")}</div>
    </div>
    <div class="setgroup"><div class="lbl">Когда показывать правильный ответ</div>
      <div class="seg" id="mode">
        <button type="button" data-m="1" aria-pressed="${settings.instant}">Сразу после ответа</button>
        <button type="button" data-m="0" aria-pressed="${!settings.instant}">В конце теста</button>
      </div>
    </div>
    <div class="setgroup"><div class="lbl">Темы</div>
      <div class="topics">${Object.entries(TOPICS).map(([k,v])=>`<label class="chk"><input type="checkbox" value="${k}" ${settings.topics.includes(k)?"checked":""}><span>${v}</span><span class="cnt">${counts[k]||0}</span></label>`).join("")}</div>
    </div>
    <div class="err" id="serr"></div>
    <div class="actions"><button class="btn" id="go">Начать тест</button></div>
  </div>
  <div class="panel weakline">
    <div><h3>Работа над ошибками</h3><p class="muted small" style="margin:4px 0 0">${weak.length ? `${weak.length} ${plural(weak.length,"вопрос","вопроса","вопросов")}, где были ошибки — сначала самые трудные.` : "Появится после первой попытки с ошибками."}</p></div>
    <button class="btn violet" id="weak" ${weak.length?"":"disabled"}>Повторить ошибки</button>
  </div>
  <div class="actions">
    <button class="btn ghost" id="stats">История и статистика</button>
    <button class="btn ghost" id="logout">Сменить пользователя</button>
  </div>`;
  document.querySelectorAll("#size button").forEach(b => b.onclick = () => { settings.size = +b.dataset.n; renderHome(); });
  document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { settings.instant = b.dataset.m==="1"; renderHome(); });
  document.querySelectorAll(".topics input").forEach(c => c.onchange = () => { settings.topics = [...document.querySelectorAll(".topics input:checked")].map(x=>x.value); });
  document.getElementById("go").onclick = () => {
    const pool = RAW.filter(r => settings.topics.includes(r.t));
    if (!pool.length){ document.getElementById("serr").textContent = "Выберите хотя бы одну тему."; return; }
    const pick = shuffle(pool).slice(0, settings.size || pool.length);
    start(pick, "Тест");
  };
  document.getElementById("weak").onclick = () => start(weak.slice(0, settings.size || weak.length).map(id=>BY_ID[id]), "Работа над ошибками", true);
  document.getElementById("stats").onclick = () => renderStats("q");
  document.getElementById("logout").onclick = () => { user = null; localStorage.removeItem(KEY_USER); renderLogin(); };
}

function start(raws, title, keepOrder){
  const list = keepOrder ? raws : shuffle(raws);
  const qs = list.map(build);
  session = { title, qs, ans: qs.map(emptyAnswer), checked: qs.map(()=>false), i:0, started:Date.now(), instant:settings.instant };
  renderQuiz();
}

function chainHTML(final){
  const dense = session.qs.length > 40;
  return `<ol class="chain${dense?" dense":""}" aria-label="Вопросы">${session.qs.map((q,i)=>{
    let cls = "res";
    if (final || session.checked[i]){ const g = grade(q, session.ans[i]); cls += g===1?" ok":g>0?" part":" bad"; }
    else if (isAnswered(q, session.ans[i])) cls += " done";
    if (i===session.i) cls += " cur";
    return `<li><button class="${cls}" data-i="${i}" aria-label="Вопрос ${i+1}" ${i===session.i?'aria-current="step"':""}>${i+1}</button></li>`;
  }).join("")}</ol>`;
}

function optionsHTML(q, a, locked){
  if (q.type==="single" || q.type==="multi"){
    const kind = q.type==="single" ? "radio" : "box";
    return `<div class="opts" role="${q.type==="single"?"radiogroup":"group"}">${q.options.map((o,i)=>{
      const sel = q.type==="single" ? a===i : a.includes(i);
      let st = "";
      if (locked){ if (sel && o.ok) st=" is-ok"; else if (sel && !o.ok) st=" is-bad"; else if (!sel && o.ok) st=" is-miss"; }
      return `<button type="button" class="opt ${kind}${st}" role="${q.type==="single"?"radio":"checkbox"}" aria-checked="${sel}" data-o="${i}" ${locked?"disabled":""}><span class="mk"></span><span>${esc(o.text)}</span></button>`;
    }).join("")}</div>`;
  }
  if (q.type==="match"){
    return `<div>${q.pairs.map((p,i)=>{
      const st = locked ? (a[i]===p.right ? " is-ok" : " is-bad") : "";
      return `<div class="mrow"><div>${esc(p.left)}</div><div><select data-m="${i}" class="${st}" ${locked?"disabled":""} aria-label="${esc(p.left)}"><option value="">Выберите…</option>${q.choices.map(c=>`<option ${a[i]===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>${locked && a[i]!==p.right ? `<div class="fix">Верно: ${esc(p.right)}</div>` : ""}</div>`;
    }).join("")}</div>`;
  }
  const st = locked ? (grade(q,a)===1 ? " is-ok" : " is-bad") : "";
  return `<input class="numin${st}" inputmode="decimal" id="num" value="${esc(a)}" ${locked?"disabled":""} aria-label="Ответ числом">`;
}

function renderQuiz(){
  const s = session, q = s.qs[s.i], a = s.ans[s.i], locked = s.checked[s.i];
  const answered = s.ans.filter((x,i)=>isAnswered(s.qs[i],x)).length;
  let verdict = "";
  if (locked){
    const g = grade(q,a);
    verdict = g===1 ? `<div class="verdict ok">Верно.</div>`
      : `<div class="verdict ${g>0?"part":"bad"}">${g>0?`Частично: ${Math.round(g*q.pairs.length)} из ${q.pairs.length}.`:"Неверно."}${q.type==="match"?"":` Правильный ответ: <b>${esc(correctText(q))}</b>`}</div>`;
  }
  $app.innerHTML = `${topBar()}
  <div class="qmeta"><span>${esc(s.title)}: вопрос ${s.i+1} из ${s.qs.length}</span><span>${TOPICS[q.t]}</span></div>
  ${chainHTML()}
  <div class="panel">
    <div class="qtext">${esc(q.text)}</div>
    <div class="qhint">${q.hint}</div>
    ${q.img ? `<img class="qimg" src="${IMAGES[q.img]}" alt="Иллюстрация к вопросу">` : ""}
    ${optionsHTML(q, a, locked)}
    ${verdict}
  </div>
  <div class="nav">
    <button class="btn ghost" id="prev" ${s.i===0?"disabled":""}>Назад</button>
    <div class="right">
      ${s.instant && !locked ? `<button class="btn violet" id="check" ${isAnswered(q,a)?"":"disabled"}>Проверить</button>` : ""}
      ${s.i < s.qs.length-1 ? `<button class="btn ${s.instant && !locked ? "ghost" : ""}" id="next">Далее</button>` : ""}
      <button class="btn ${s.i===s.qs.length-1 ? "" : "ghost"}" id="finish">Завершить (${answered}/${s.qs.length})</button>
    </div>
  </div>`;

  document.querySelectorAll(".chain .res").forEach(b => b.onclick = () => { s.i = +b.dataset.i; renderQuiz(); });
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const o = +b.dataset.o;
    if (q.type==="single") s.ans[s.i] = o;
    else { const arr = s.ans[s.i]; const k = arr.indexOf(o); k>=0 ? arr.splice(k,1) : arr.push(o); }
    renderQuiz();
  });
  document.querySelectorAll("select[data-m]").forEach(sel => sel.onchange = () => { s.ans[s.i][+sel.dataset.m] = sel.value; renderQuiz(); });
  const num = document.getElementById("num");
  if (num){ num.oninput = () => { s.ans[s.i] = num.value; const c=document.getElementById("check"); if(c) c.disabled = !num.value.trim(); };
    num.onkeydown = e => { if (e.key==="Enter"){ const c=document.getElementById("check"); (c && !c.disabled ? c : document.getElementById("next"))?.click(); } };
    if (!locked) num.focus(); }
  const prev = document.getElementById("prev"); if (prev) prev.onclick = () => { s.i--; renderQuiz(); };
  const next = document.getElementById("next"); if (next) next.onclick = () => { s.i++; renderQuiz(); };
  const chk = document.getElementById("check"); if (chk) chk.onclick = () => { s.checked[s.i] = true; renderQuiz(); };
  document.getElementById("finish").onclick = () => {
    const left = s.qs.length - s.ans.filter((x,i)=>isAnswered(s.qs[i],x)).length;
    if (left && !confirm(`Без ответа ${left} ${plural(left,"вопрос","вопроса","вопросов")}. Завершить тест?`)) return;
    finish();
  };
  window.scrollTo({top:0});
}

function finish(){
  const s = session;
  const grades = s.qs.map((q,i)=>grade(q, s.ans[i]));
  const score = grades.reduce((a,b)=>a+b,0);
  const h = loadHist();
  h.attempts.push({ date:Date.now(), title:s.title, n:s.qs.length, score, dur:Math.round((Date.now()-s.started)/1000), items:s.qs.map((q,i)=>({id:q.id, g:grades[i]})) });
  s.qs.forEach((q,i)=>{ const st = h.q[q.id] || (h.q[q.id] = {seen:0, wrong:0}); st.seen++; if (grades[i] < 1) st.wrong++; st.last = grades[i]; });
  saveHist(h);
  s.grades = grades; s.score = score;
  renderResult(false);
}

function renderResult(onlyWrong){
  const s = session, pct = Math.round(s.score / s.qs.length * 100);
  const items = s.qs.map((q,i)=>({q,i,g:s.grades[i]})).filter(x => !onlyWrong || x.g < 1);
  const mins = Math.floor((Date.now()-s.started)/60000);
  $app.innerHTML = `${topBar()}
  <div class="qmeta"><span>${esc(s.title)}: результат</span><span>${mins} мин</span></div>
  ${chainHTML(true).replace(/ cur/g,"")}
  <div class="panel">
    <div class="score"><span class="big">${pct}%</span><span class="muted">${fmt(s.score)} из ${s.qs.length} ${plural(s.qs.length,"балла","баллов","баллов")}</span></div>
    <p class="muted" style="margin-top:8px">${pct>=90?"Отлично.":pct>=70?"Хорошо. Ошибки ниже — их стоит повторить.":pct>=50?"Удовлетворительно. Разберите ошибки и пройдите «Работу над ошибками».":"Нужно повторить материал. Начните с разбора ошибок ниже."}</p>
    <div class="actions">
      <button class="btn" id="again">Новый тест</button>
      <button class="btn ghost" id="copy">Скопировать результат</button>
      <button class="btn ghost" id="toggle">${onlyWrong ? "Показать все вопросы" : "Только ошибки"}</button>
    </div>
  </div>
  <div class="review">${items.length ? items.map(({q,i,g})=>`
    <div class="ritem ${g===1?"ok":g>0?"part":"bad"}">
      <div class="q">${i+1}. ${esc(q.text)}</div>
      ${q.img ? `<img class="qimg" src="${IMAGES[q.img]}" alt="" style="max-width:360px">` : ""}
      <div class="l">Ваш ответ</div><div class="v ${g===1?"good":"wrong"}" style="white-space:pre-line">${esc(userText(q, s.ans[i]))}</div>
      ${g<1 ? `<div class="l" style="margin-top:6px">Правильный ответ</div><div class="v good" style="white-space:pre-line">${esc(correctText(q))}</div>` : ""}
    </div>`).join("") : `<div class="empty">Ошибок нет.</div>`}</div>`;
  document.getElementById("again").onclick = renderHome;
  document.getElementById("toggle").onclick = () => renderResult(!onlyWrong);
  document.getElementById("copy").onclick = () => {
    const txt = `${user.last} ${user.first}, гр. ${user.group}\n${s.title} (белки и ферменты): ${fmt(s.score)} из ${s.qs.length} (${pct}%)\n${new Date().toLocaleString("ru-RU")}`;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("Результат скопирован"), ()=>prompt("Скопируйте результат:", txt));
  };
}

function renderStats(tab){
  const h = loadHist();
  const rows = Object.entries(h.q).filter(([id])=>BY_ID[id]).map(([id,st])=>({id, st, r:BY_ID[id], rate: 1 - st.wrong/st.seen}))
    .sort((a,b)=> a.rate - b.rate || b.st.seen - a.st.seen);
  const topicAgg = {}; Object.keys(TOPICS).forEach(k=>topicAgg[k]={sum:0,n:0});
  h.attempts.forEach(at => at.items.forEach(it => { const r = BY_ID[it.id]; if (r){ topicAgg[r.t].sum += it.g; topicAgg[r.t].n++; } }));
  const meter = v => `<div class="meter ${v<.5?"low":v<.75?"mid":""}"><i style="width:${Math.round(v*100)}%"></i></div>`;
  let body = "";
  if (!h.attempts.length) body = `<div class="empty">Здесь появится статистика после первой попытки.</div>`;
  else if (tab==="q") body = `<p class="muted small">Сверху — вопросы, на которые чаще всего отвечали неверно.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Вопрос</th><th class="num">Ошибок</th><th>Верно</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(qTitle(x.r))}<div class="small muted">${TOPICS[x.r.t]}</div></td><td class="num">${x.st.wrong} из ${x.st.seen}</td><td>${meter(x.rate)}</td></tr>`).join("")}</tbody></table></div>`;
  else if (tab==="t") body = `<div class="tbl-wrap"><table><thead><tr><th>Тема</th><th class="num">Ответов</th><th class="num">Верно</th><th></th></tr></thead><tbody>${Object.entries(topicAgg).map(([k,v])=>`<tr><td>${TOPICS[k]}</td><td class="num">${v.n}</td><td class="num">${v.n?Math.round(v.sum/v.n*100)+"%":"—"}</td><td>${v.n?meter(v.sum/v.n):""}</td></tr>`).join("")}</tbody></table></div>`;
  else body = `<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Режим</th><th class="num">Баллы</th><th class="num">%</th><th class="num">Время</th></tr></thead><tbody>${h.attempts.slice().reverse().map(a=>`<tr><td>${new Date(a.date).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(a.title)}</td><td class="num">${fmt(a.score)} / ${a.n}</td><td class="num">${Math.round(a.score/a.n*100)}</td><td class="num">${Math.floor(a.dur/60)}:${String(a.dur%60).padStart(2,"0")}</td></tr>`).join("")}</tbody></table></div>`;
  $app.innerHTML = `${topBar()}
  <h1 style="font-size:30px">История и статистика</h1>
  <div class="tabs seg" style="display:inline-flex">
    <button data-t="q" aria-pressed="${tab==="q"}">Трудные вопросы</button>
    <button data-t="t" aria-pressed="${tab==="t"}">По темам</button>
    <button data-t="a" aria-pressed="${tab==="a"}">Попытки (${h.attempts.length})</button>
  </div>
  <div class="panel">${body}</div>
  <div class="actions">
    <button class="btn" id="back">На главную</button>
    <button class="btn ghost" id="exp" ${h.attempts.length?"":"disabled"}>Сохранить историю в файл</button>
    <label class="btn ghost" style="cursor:pointer">Загрузить из файла<input type="file" accept="application/json" id="imp" hidden></label>
    <button class="btn link" id="clear" ${h.attempts.length?"":"disabled"}>Очистить историю</button>
  </div>`;
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => renderStats(b.dataset.t));
  document.getElementById("back").onclick = renderHome;
  document.getElementById("exp").onclick = () => {
    const blob = new Blob([JSON.stringify({user, hist:h}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `biochem-test_${user.last}_${user.group}.json`.replace(/\s+/g,"_"); a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  document.getElementById("imp").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      const d = JSON.parse(t); const src = d.hist || d;
      if (!src.attempts || !src.q) throw 0;
      const cur = loadHist(), seen = new Set(cur.attempts.map(a=>a.date));
      src.attempts.forEach(a => { if (!seen.has(a.date)){ cur.attempts.push(a); a.items.forEach(it=>{ const st = cur.q[it.id] || (cur.q[it.id]={seen:0,wrong:0}); st.seen++; if(it.g<1) st.wrong++; }); } });
      cur.attempts.sort((a,b)=>a.date-b.date); saveHist(cur); toast("История загружена"); renderStats(tab);
    }).catch(()=>toast("Файл не похож на историю этого теста"));
  };
  document.getElementById("clear").onclick = () => { if (confirm("Удалить всю историю на этом устройстве?")){ localStorage.removeItem(histKey(user)); renderStats(tab); } };
}

user ? renderHome() : renderLogin();
})();
</script>
</body>
</html>
